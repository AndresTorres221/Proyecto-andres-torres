<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            margin-bottom: 20px;
        }

        input, select {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>

</head>

<body>

<h1>CRUD DE PRODUCTOS</h1>

<!-- FORMULARIO CREAR PRODUCTO -->
<form th:action="@{/vista/productos}" method="post">

    <input type="text" name="nombre" placeholder="Nombre" required>

    <input type="text" name="descripcion" placeholder="Descripción">

    <input type="number" step="0.01" name="precio" placeholder="Precio" required>

    <input type="number" name="cantidad" placeholder="Cantidad" required>

    <!-- CATEGORÍAS DINÁMICAS -->
    <select name="categoria.id" required>
        <option value="">Seleccione categoría</option>

        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nombre}">
        </option>
    </select>

    <!-- ESTADOS DINÁMICOS -->
    <select name="estado.id" required>
        <option value="">Seleccione estado</option>

        <option th:each="e : ${estados}"
                th:value="${e.id}"
                th:text="${e.nombre}">
        </option>
    </select>

    <button type="submit">Guardar</button>

</form>

<hr>

<!-- TABLA DE PRODUCTOS -->
<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="p : ${productos}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.cantidad}"></td>

            <td>
                <a th:href="@{'/vista/productos/eliminar/' + ${p.id}}">
                    Eliminar
                </a>
            </td>

        </tr>
    </tbody>

</table>

</body>
</html>
