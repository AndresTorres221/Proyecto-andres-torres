<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            margin-bottom: 20px;
        }

        input, select {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        a {
            margin: 5px;
        }
    </style>

</head>

<body>

<h1>CRUD DE PRODUCTOS</h1>


<form th:action="@{/vista/productos}" method="post">

    <input type="hidden"
           name="id"
           th:value="${producto != null ? producto.id : ''}">

    <input type="text"
           name="nombre"
           placeholder="Nombre"
           required
           th:value="${producto != null ? producto.nombre : ''}">

    <input type="text"
           name="descripcion"
           placeholder="Descripción"
           th:value="${producto != null ? producto.descripcion : ''}">

    <input type="number"
           step="0.01"
           name="precio"
           placeholder="Precio"
           required
           th:value="${producto != null ? producto.precio : ''}">

    <input type="number"
           name="cantidad"
           placeholder="Cantidad"
           required
           th:value="${producto != null ? producto.cantidad : ''}">

   
    <select name="categoria.id" required>

        <option value="">Seleccione categoría</option>

        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nombre}"
                th:selected="${producto != null and producto.categoria != null and producto.categoria.id == c.id}">
        </option>

    </select>

   
    <select name="estado.id" required>

        <option value="">Seleccione estado</option>

        <option th:each="e : ${estados}"
                th:value="${e.id}"
                th:text="${e.nombre}"
                th:selected="${producto != null and producto.estado != null and producto.estado.id == e.id}">
        </option>

    </select>

    <button type="submit">
        <span th:text="${producto != null ? 'Actualizar' : 'Guardar'}"></span>
    </button>

</form>

<hr>


<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Cantidad</th>

            <!-- NUEVO -->
            <th>Categoría</th>
            <th>Estado</th>

            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="p : ${productos}">

            <td th:text="${p.id}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.cantidad}"></td>

            
            <td th:text="${p.categoria?.nombre}"></td>
            <td th:text="${p.estado?.nombre}"></td>

            <td>

                <a th:href="@{'/vista/productos/editar/' + ${p.id}}">
                    Editar
                </a>

                <a th:href="@{'/vista/productos/eliminar/' + ${p.id}}">
                    Eliminar
                </a>

            </td>

        </tr>

    </tbody>

</table>

</body>
</html>
